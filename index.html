<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Oscar!</title>
    <link rel="stylesheet" href="style.css">
    <!-- Confetti JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
</head>
<body>
    <main class="card">
        <div class="image-container">
            <img src="images/birthdaypngremovebg.png" alt="Party Hat" class="party-hat">
        </div>
        
        <header>
            <h1>Happy Birthday, Oscar!</h1>
        </header>

        <section class="message">
            <p>Happy birthday, Oscar! Have a good day! - From Samuel</p>
        </section>

        <footer>
            <p>Enjoy your special day!</p>
        </footer>
    </main>

    <!-- Script to trigger confetti automatically on load -->
    <script>
        window.onload = function() {
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });
        };
    </script>
</body>
</html>
